<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Sin conexión</title>
    <script>(function(){var p;try{p=localStorage.getItem('tema');}catch(e){}var o=p==='oscuro'||(p!=='claro'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',o?'dark':'light');})();</script>
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
            background: var(--surface-page); color: var(--text-main); text-align: center;
            font-family: var(--font-ui, system-ui, sans-serif);
        }
        main { max-width: 360px; }
        svg { width: 56px; height: 56px; color: var(--text-muted); }
        h1 { font-size: 1.35rem; margin: 16px 0 8px; }
        p { color: var(--text-muted); line-height: 1.5; margin: 0 0 24px; }
        button {
            font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 14px 28px;
            background: var(--text-main); color: var(--surface-card); cursor: pointer; min-width: 180px;
        }
        button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
    </style>
</head>
<body>
<main>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.6a10 10 0 0 1 14 0"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/><line x1="3" y1="3" x2="21" y2="21"/>
    </svg>
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Revisa el Wi-Fi o los datos del celular y vuelve a intentar.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
