spring.application.name=pedidosCori

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ekwe_iyawe}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

server.port=${PORT:8080}
# Detrás de un proxy HTTPS (Railway, Caddy, Nginx) usar native; en Railway se activa solo.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
# Las redirecciones son siempre relativas (ver config/ProxyConfig) para cumplir la CSP form-action 'self'.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

server.servlet.session.timeout=3600
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.mesero-password=${SEED_MESERO_PASSWORD:}
app.seed.cocina-password=${SEED_COCINA_PASSWORD:}
app.seed.superadmin-username=${SEED_SUPERADMIN_USERNAME:superadmin}
app.seed.superadmin-password=${SEED_SUPERADMIN_PASSWORD:}
app.seed.demo-data=${SEED_DEMO_DATA:false}
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.block-minutes=${LOGIN_BLOCK_MINUTES:15}
app.recuperar-acceso=${RECUPERAR_ACCESO:}
